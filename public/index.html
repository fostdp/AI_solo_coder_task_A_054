<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧港口集装箱堆场监控系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-left">
                <h1>智慧港口集装箱堆场监控系统</h1>
                <div class="connection-status">
                    <span id="connection-dot" class="status-dot"></span>
                    <span id="connection-text">连接中...</span>
                </div>
            </div>
            <div class="header-right">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="输入箱号搜索集装箱...">
                    <button id="search-btn">搜索</button>
                </div>
                <div class="time-display">
                    <span id="current-time"></span>
                </div>
            </div>
        </header>

        <div class="main-content">
            <aside class="sidebar">
                <div class="panel stats-panel">
                    <h3>堆场统计</h3>
                    <div class="stats-overview">
                        <div class="stat-item">
                            <span class="stat-label">总箱位数</span>
                            <span class="stat-value" id="total-slots">500</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">已用箱位</span>
                            <span class="stat-value" id="used-slots">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">总集装箱</span>
                            <span class="stat-value" id="total-containers">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">总利用率</span>
                            <span class="stat-value highlight" id="utilization-rate">0%</span>
                        </div>
                    </div>

                    <div class="zone-stats">
                        <h4>各区域利用率</h4>
                        <div id="zone-stats-container"></div>
                    </div>
                </div>

                <div class="panel legend-panel">
                    <h3>图例</h3>
                    <div class="legend-items">
                        <div class="legend-item">
                            <div class="legend-color" style="background: #e0e0e0; border-color: #9e9e9e;"></div>
                            <span>空箱位</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #4caf50; border-color: #2e7d32;"></div>
                            <span>1-2层</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #ffc107; border-color: #f57f17;"></div>
                            <span>3-4层</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #f44336; border-color: #c62828;"></div>
                            <span>5-6层</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #2196f3; border-color: #0d47a1;"></div>
                            <span>搜索高亮</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color alert" style="background: #9c27b0;"></div>
                            <span>超高告警</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color alert" style="background: #ff5722;"></div>
                            <span>超重告警</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color alert" style="background: #e91e63;"></div>
                            <span>超时告警</span>
                        </div>
                    </div>
                </div>

                <div class="panel alerts-panel">
                    <h3>
                        活动告警
                        <span class="alert-badge" id="alert-count">0</span>
                    </h3>
                    <div class="alerts-list" id="alerts-list">
                        <p class="no-alerts">暂无告警</p>
                    </div>
                </div>
            </aside>

            <main class="content">
                <div class="canvas-container">
                    <div class="canvas-header">
                        <h2 id="yard-title">堆场平面图</h2>
                        <div class="canvas-controls">
                            <button id="zoom-in">放大</button>
                            <button id="zoom-out">缩小</button>
                            <button id="zoom-reset">重置</button>
                        </div>
                    </div>
                    <div class="canvas-wrapper" id="canvas-wrapper">
                        <canvas id="yard-canvas"></canvas>
                    </div>
                </div>
            </main>
        </div>

        <div class="modal-overlay" id="slot-modal">
            <div class="modal">
                <div class="modal-header">
                    <h3 id="modal-title">箱位详情</h3>
                    <button class="close-btn" id="close-modal">&times;</button>
                </div>
                <div class="modal-body" id="modal-content">
                </div>
            </div>
        </div>

        <div class="tooltip" id="tooltip"></div>
    </div>

    <script src="js/container-locator.js"></script>
    <script src="js/yard-statistics.js"></script>
    <script src="js/yard-map.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
